<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Ashin Cell</title><style>
:root{font-family:system-ui,sans-serif;color:#12233b;background:#eef5ff}*{box-sizing:border-box}body{margin:0}main{max-width:1020px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px}section,.panel{background:#fff;border:1px solid #dce7f5;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #184d8010}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #ccd9e8;border-radius:10px;padding:11px;margin:5px 0 12px}label{font-size:13px;font-weight:650}button,.btn{border:0;border-radius:10px;background:#0759bd;color:white;padding:11px 14px;cursor:pointer;font-weight:700}button.secondary{background:#e6f0ff;color:#0759bd}button.danger{background:#b91c1c}button:disabled{opacity:.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hide{display:none!important}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #edf2f8;padding:12px 0}.row strong{display:block}.row small{color:#64748b}#status{color:#475569;font-size:13px}#products{max-height:560px;overflow:auto}input[type=checkbox]{width:auto;margin:0 6px 0 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}header{align-items:flex-start}}
</style></head><body><main><header><div><h1>⚡ Admin Ashin Cell</h1><p id="status">Memeriksa konfigurasi Firebase…</p></div><a href="./index.html">Kembali ke toko</a></header>
<section id="login"><h2>Login administrator</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="signIn">Masuk</button><p>Hanya akun Firebase dengan UID administrator yang dapat mengelola produk.</p></section>
<div id="dashboard" class="hide"><section><div class="toolbar"><button id="signOut" class="secondary">Keluar</button><button id="seed">Impor 34 produk awal</button><button id="export" class="secondary">Ekspor JSON</button><label class="btn" for="importFile">Impor JSON<input id="importFile" type="file" accept="application/json,.json" style="display:none"></label><button id="activate" class="secondary">Aktifkan semua</button><button id="deactivate" class="secondary">Nonaktifkan semua</button></div><p id="count"></p></section>
<section><h2 id="formTitle">Tambah produk</h2><form id="productForm"><input id="id" type="hidden"><div class="grid"><label>Nama produk<input id="name" required maxlength="140"></label><label>Kategori<select id="category"><option>Paket Akrab</option><option>XL Harian</option><option>Masa Aktif</option></select></label><label>Harga (Rp)<input id="price" type="number" min="0" step="1" required></label><label>Area (khusus Akrab)<select id="area"><option value="">Tidak ada</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div><label>Deskripsi<textarea id="description" rows="2" maxlength="500"></textarea></label><label><input id="active" type="checkbox" checked>Produk aktif</label><div class="toolbar"><button type="submit">Simpan produk</button><button type="button" id="reset" class="secondary">Batal edit</button></div></form></section>
<section><h2>Kelola katalog</h2><input id="search" placeholder="Cari produk…"><div id="products"></div></section></div></main>
<script type="module">
import {firebaseConfig,firebaseReady} from './firebase-config.js';
const $=id=>document.getElementById(id), status=t=>$('status').textContent=t;
if(!firebaseReady){status('Firebase belum dikonfigurasi. Isi firebase-config.js terlebih dahulu.');$('signIn').disabled=true;}else{
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
const {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
const {getFirestore,doc,getDoc,collection,getDocs,setDoc,deleteDoc,writeBatch,onSnapshot}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const ADMIN_UID="z9d9XlrsGBVuov9W6QNwrWaqUkG2";let products=[],unsubscribe=null;
const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid=p=>p&&typeof p.name==='string'&&p.name.trim()&&['Paket Akrab','XL Harian','Masa Aktif'].includes(p.category)&&Number.isInteger(Number(p.price))&&Number(p.price)>=0;
const normalize=p=>({name:p.name.trim(),category:p.category,price:Number(p.price),description:String(p.description||'').slice(0,500),active:p.active!==false,area:p.area?Number(p.area):null,emoji:String(p.emoji||'📶').slice(0,5)});
async function bulk(items){for(let i=0;i<items.length;i+=400){let batch=writeBatch(db);items.slice(i,i+400).forEach(p=>batch.set(doc(db,'products',p.id),normalize(p)));await batch.commit();}}
function reset(){ $('productForm').reset();$('id').value='';$('formTitle').textContent='Tambah produk';$('active').checked=true; }$('reset').onclick=reset;
function render(){const q=$('search').value.toLowerCase();$('count').textContent=products.length+' produk tersimpan';$('products').innerHTML=products.filter(p=>(p.name||'').toLowerCase().includes(q)).map(p=>`<div class="row"><div><strong>${safe(p.name)}</strong><small>${safe(p.category)} • Rp${Number(p.price||0).toLocaleString('id-ID')} • ${p.active?'Aktif':'Nonaktif'}</small></div><div class="toolbar"><button class="secondary" data-edit="${safe(p.id)}">Edit</button><button class="danger" data-del="${safe(p.id)}">Hapus</button></div></div>`).join('')||'<p>Belum ada produk.</p>';}
$('search').oninput=render;
$('products').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(edit){const p=products.find(x=>x.id===edit.dataset.edit);if(!p)return;['id','name','category','price','description'].forEach(k=>$(k).value=p[k]??'');$('area').value=p.area||'';$('active').checked=p.active!==false;$('formTitle').textContent='Edit produk';scrollTo({top:0,behavior:'smooth'});}if(del&&confirm('Hapus produk ini?')){try{await deleteDoc(doc(db,'products',del.dataset.del));}catch(err){alert(err.message);}}};
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('id').value||'produk-'+crypto.randomUUID();const p={name:$('name').value,category:$('category').value,price:Number($('price').value),description:$('description').value,active:$('active').checked,area:$('area').value};if(!valid(p))return alert('Periksa data produk');try{await setDoc(doc(db,'products',id),normalize(p));reset();status('Produk berhasil disimpan.');}catch(err){alert(err.message);}};
$('signIn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);}catch(err){status('Login gagal: '+err.message);}};
$('signOut').onclick=()=>signOut(auth);
$('seed').onclick=async()=>{if(!confirm('Impor 34 produk awal? Produk dengan ID sama akan ditimpa.'))return;try{const r=await fetch('./products.json',{cache:'no-store'});const a=await r.json();await bulk(a);status(a.length+' produk berhasil diimpor.');}catch(err){alert(err.message);}};
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a)||a.length>2000||a.some(p=>!p.id||!valid(p)))throw Error('JSON harus berupa array produk valid dengan id, name, category, price');if(confirm('Impor '+a.length+' produk? ID sama akan ditimpa.')){await bulk(a);status('Impor selesai.');}}catch(err){alert(err.message);}e.target.value='';};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ashin-cell-products.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
async function setAll(active){if(!confirm((active?'Aktifkan':'Nonaktifkan')+' semua produk?'))return;try{await bulk(products.map(p=>({...p,active})));status('Status produk berhasil diperbarui.');}catch(err){alert(err.message);}}$('activate').onclick=()=>setAll(true);$('deactivate').onclick=()=>setAll(false);
onAuthStateChanged(auth,async user=>{if(unsubscribe){unsubscribe();unsubscribe=null;}if(!user){$('login').classList.remove('hide');$('dashboard').classList.add('hide');status('Silakan login.');return;}try{if(user.uid!==ADMIN_UID){status('Akun ini bukan administrator Ashin Cell.');await signOut(auth);return;}$('login').classList.add('hide');$('dashboard').classList.remove('hide');status('Login admin berhasil.');unsubscribe=onSnapshot(collection(db,'products'),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));render();},err=>status('Gagal membaca produk: '+err.message));}catch(err){status('Verifikasi admin gagal: '+err.message);}});
}
</script></body></html>
